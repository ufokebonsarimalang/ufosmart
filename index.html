<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Digital Toko</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
            user-select: none;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .app-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 50px;
        }
        .btn-absent {
            height: 90px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 16px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* TAMPILAN JAM DI DALAM TOMBOL SAAT DISABLED */
        .btn-absent:disabled {
            opacity: 0.85 !important;
            cursor: not-allowed;
            filter: none !important;
        }
        .btn-absent:disabled .time-subtext {
            color: #000000 !important;
            background: #ffffff !important;
            border: 1px solid #10b981 !important;
            font-weight: 800 !important;
        }
        
        .time-subtext {
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        .camera-box {
            width: 100%;
            height: 240px;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        #video, #canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .stats-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .table-responsive {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <div class="app-header">
        <h5 class="mb-0 font-weight-bold"><i class="fas me-2"></i>ABSENSI DIGITAL</h5>
        <small id="sub-header">Sistem Kehadiran Karyawan</small>
    </div>

    <div class="p-4">
        <!-- VIEW 1: LOGIN -->
        <div id="view-login">
            <div class="mb-3">
                <label class="form-label font-weight-bold">ID / Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="user" class="form-control" placeholder="Masukkan ID Anda">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label font-weight-bold">Kata Sandi</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="pass" class="form-control" placeholder="Masukkan Kata Sandi">
                </div>
            </div>
            <button onclick="prosesLogin()" class="btn btn-primary w-100 py-3 font-weight-bold" style="border-radius: 12px;">
                MASUK APLIKASI
            </button>
        </div>

        <!-- VIEW 2: DASHBOARD KARYAWAN -->
        <div id="view-dashboard" style="display: none;">
            <!-- INFO USER -->
            <div class="d-flex justify-content-between align-items-center mb-3 bg-light p-2 rounded-3">
                <div>
                    <strong id="nama-user" class="d-block text-dark">Nama User</strong>
                    <span id="label-periode" class="text-muted" style="font-size: 0.75rem;">Periode: -</span>
                </div>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>

            <!-- INDIKATOR LOKASI & WAKTU -->
            <div class="card bg-light border-0 mb-3">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <small><i class="fas fa-clock text-primary me-1"></i> SINKRON SERVER:</small>
                        <strong id="jam-server" class="text-primary">--:--:-- WIB</strong>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <small><i class="fas fa-map-marker-alt text-danger me-1"></i> STATUS LOKASI:</small>
                        <span id="status-gps" class="badge bg-secondary status-badge">Mendapatkan lokasi...</span>
                    </div>
                </div>
            </div>

            <!-- KAMERA -->
            <div class="camera-box mb-3">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display: none;"></canvas>
            </div>

            <!-- TOMBOL ABSEN -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <button id="btn-in" onclick="kirimAbsen('IN')" class="btn btn-success w-100 btn-absent" disabled>
                        <i class="fas fa-sign-in-alt mb-1"></i>
                        <span>CHECK IN</span>
                        <div id="sub-in" class="time-subtext" style="display:none;"></div>
                    </button>
                </div>
                <div class="col-6">
                    <button id="btn-out" onclick="kirimAbsen('OUT')" class="btn btn-danger w-100 btn-absent" disabled>
                        <i class="fas fa-sign-out-alt mb-1"></i>
                        <span>CHECK OUT</span>
                        <div id="sub-out" class="time-subtext" style="display:none;"></div>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <button id="btn-off" onclick="kirimAbsen('OFF')" class="btn btn-warning text-white w-100 btn-absent" style="height: 50px;" disabled>
                        <i class="fas fa-bed me-1"></i> ABSEN LIBUR (OFF)
                        <div id="sub-off" class="time-subtext" style="display:none;"></div>
                    </button>
                </div>
            </div>

            <!-- STATISTIK PERIODE -->
            <div class="row g-2 mb-2">
                <div class="col-3">
                    <div class="stats-card">
                        <small class="text-muted d-block" style="font-size:0.65rem;">HADIR</small>
                        <strong id="st-hadir" class="text-success">0</strong>
                    </div>
                </div>
                <div class="col-3">
                    <div class="stats-card">
                        <small class="text-muted d-block" style="font-size:0.65rem;">TERLAMBAT</small>
                        <strong id="st-telat" class="text-danger">0</strong>
                    </div>
                </div>
                <div class="col-3">
                    <div class="stats-card">
                        <small class="text-muted d-block" style="font-size:0.65rem;">OFF</small>
                        <strong id="st-off" class="text-warning">0</strong>
                    </div>
                </div>
                <div class="col-3">
                    <div class="stats-card">
                        <small class="text-muted d-block" style="font-size:0.65rem;">PAS</small>
                        <strong id="st-ps" class="text-info">0</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 3: ADMIN PANEL -->
        <div id="view-admin" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0 font-weight-bold"><i class="fas fa-user-shield me-1"></i> PANEL ADMIN</h6>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill">Keluar</button>
            </div>

            <!-- TOMBOL UNDUH CSV -->
            <div class="card bg-light border-0 mb-3">
                <div class="card-body p-3">
                    <label class="form-label font-weight-bold" style="font-size: 0.85rem;">Unduh Rekap Laporan (.CSV)</label>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="date" id="tgl-mulai" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <input type="date" id="tgl-selesai" class="form-control form-control-sm">
                        </div>
                        <div class="col-12 mt-2">
                            <button onclick="unduhLaporanCSV()" class="btn btn-success btn-sm w-100">
                                <i class="fas fa-file-excel me-1"></i> Download Rekap CSV
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- REKAP TABEL SEMENTARA -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="font-weight-bold">Log Absensi Terbaru</small>
                <button onclick="muatDataAdmin()" class="btn btn-light btn-sm"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-striped style-text-sm" style="font-size: 0.75rem;">
                    <thead class="table-dark">
                        <tr>
                            <th>Waktu</th>
                            <th>Nama</th>
                            <th>Tipe</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-admin-body">
                        <tr><td colspan="4" class="text-center text-muted">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    // URL Web App Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwc8u7zly725v4L75J73q978oH_XoV1QJ-E8R2qR3-J_Y4w-e5q6T7Y8U9V0W/exec"; // Sesuaikan jika ada URL terbaru Anda

    let userLat = null;
    let userLng = null;
    let namaLogin = "";
    let userPassKey = "";
    let wibOffset = 0;
    let gpsWatcher = null;

    // --- SINKRONISASI WAKTU SERVER ---
    function syncServerTime() {
        const start = Date.now();
        fetch(SCRIPT_URL + "?action=getWaktuServer")
            .then(res => res.json())
            .then(data => {
                const now = Date.now();
                const latency = Math.floor((now - start) / 2);
                const serverTime = new Date(data.waktuWIB).getTime();
                wibOffset = (serverTime + latency) - now;
            })
            .catch(() => { wibOffset = 0; });
    }
    syncServerTime();
    setInterval(syncServerTime, 600000); // Sync tiap 10 menit

    function getWIBDate() {
        return new Date(Date.now() + wibOffset);
    }

    setInterval(() => {
        const d = getWIBDate();
        const text = d.toLocaleTimeString('id-ID', { hour12: false }) + " WIB";
        const el = document.getElementById('jam-server');
        if(el) el.innerText = text;
    }, 1000);

    // --- PROSES LOGIN ---
    function prosesLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();

        if(!u || !p) return alert("Silakan isi ID dan Sandi!");

        fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "sukses") {
                    namaLogin = data.nama;
                    userPassKey = p;

                    // SIMPAN SESI LOGIN (AGAR TIDAK KELUAR SAAT REFRESH)
                    localStorage.setItem('sesi_username', u);
                    localStorage.setItem('sesi_password', p);

                    document.getElementById('view-login').style.display = 'none';

                    if(data.role === "admin") {
                        document.getElementById('view-admin').style.display = 'block';
                        document.getElementById('sub-header').innerText = "Panel Administrator";
                        muatDataAdmin();
                    } else {
                        document.getElementById('view-dashboard').style.display = 'block';
                        document.getElementById('nama-user').innerText = namaLogin;
                        document.getElementById('sub-header').innerText = "Dashboard Absensi Karyawan";
                        
                        initKamera();
                        initGPS();
                        cekStatusHariIni();
                        muatStatistikTerbaruServer();
                    }
                } else {
                    alert("Login Gagal: " + data.pesan);
                }
            })
            .catch(err => alert("Gagal koneksi ke server!"));
    }

    function logout() {
        // HAPUS SESI LOGIN SAAT TEKAN KELUAR
        localStorage.removeItem('sesi_username');
        localStorage.removeItem('sesi_password');

        if (gpsWatcher) {
            navigator.geolocation.clearWatch(gpsWatcher);
            gpsWatcher = null;
        }
        namaLogin = "";
        userPassKey = "";
        document.getElementById('user').value = "";
        document.getElementById('pass').value = "";
        document.getElementById('view-dashboard').style.display = 'none';
        document.getElementById('view-admin').style.display = 'none';
        document.getElementById('view-login').style.display = 'block';
        kunciTombolKerja(false);
    }

    // --- KAMERA & GPS ---
    function initKamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                document.getElementById('video').srcObject = stream;
            })
            .catch(err => alert("Gagal mengakses kamera HP!"));
    }

    function initGPS() {
        if(!navigator.geolocation) return alert("Browser tidak mendukung GPS!");

        gpsWatcher = navigator.geolocation.watchPosition(
            pos => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;

                // Verifikasi radius radius dari toko (Server memvalidasi radius 100m)
                document.getElementById('status-gps').className = "badge bg-success status-badge";
                document.getElementById('status-gps').innerText = "GPS Terhubung & Aktif";
                
                // Aktifkan tombol jika belum terkunci status absen
                cekAturanTombolKerja();
            },
            err => {
                document.getElementById('status-gps').className = "badge bg-danger status-badge";
                document.getElementById('status-gps').innerText = "GPS Matikan/Gagal";
                kunciTombolKerja(true);
            },
            { enableHighAccuracy: true, maximumAge: 0 }
        );
    }

    function kunciTombolKerja(status) {
        document.getElementById('btn-in').disabled = status;
        document.getElementById('btn-out').disabled = status;
        document.getElementById('btn-off').disabled = status;
    }

    let statusInToday = false;
    let statusOutToday = false;
    let statusOffToday = false;
    let waktuInToday = "";
    let waktuOutToday = "";

    function cekAturanTombolKerja() {
        if(!userLat || !userLng) {
            kunciTombolKerja(true);
            return;
        }

        if(statusOffToday) {
            document.getElementById('btn-in').disabled = true;
            document.getElementById('btn-out').disabled = true;
            document.getElementById('btn-off').disabled = true;
            
            document.getElementById('sub-off').innerText = "SUDAH OFF";
            document.getElementById('sub-off').style.display = "block";
            return;
        }

        if(statusInToday) {
            document.getElementById('btn-in').disabled = true;
            document.getElementById('sub-in').innerText = "IN: " + waktuInToday;
            document.getElementById('sub-in').style.display = "block";

            document.getElementById('btn-off').disabled = true;

            if(statusOutToday) {
                document.getElementById('btn-out').disabled = true;
                document.getElementById('sub-out').innerText = "OUT: " + waktuOutToday;
                document.getElementById('sub-out').style.display = "block";
            } else {
                document.getElementById('btn-out').disabled = false;
                document.getElementById('sub-out').style.display = "none";
            }
        } else {
            document.getElementById('btn-in').disabled = false;
            document.getElementById('btn-out').disabled = true;
            document.getElementById('btn-off').disabled = false;
            document.getElementById('sub-in').style.display = "none";
            document.getElementById('sub-out').style.display = "none";
            document.getElementById('sub-off').style.display = "none";
        }
    }

    // --- CEK STATUS ABSEN HARI INI ---
    function cekStatusHariIni() {
        const u = document.getElementById('user').value.trim();
        fetch(`${SCRIPT_URL}?action=cekStatusToday&username=${encodeURIComponent(u)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "sukses") {
                    statusInToday = data.hasIn;
                    statusOutToday = data.hasOut;
                    statusOffToday = data.hasOff;
                    waktuInToday = data.timeIn || "";
                    waktuOutToday = data.timeOut || "";
                    
                    cekAturanTombolKerja();
                }
            });
    }

    // --- PROSES KIRIM ABSENSI ---
    function kirimAbsen(tipe) {
        if(!userLat || !userLng) return alert("Lokasi GPS belum didapatkan!");

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Watermark Teks di Foto
        const wibStr = getWIBDate().toLocaleString('id-ID');
        context.font = "12px Arial";
        context.fillStyle = "yellow";
        context.fillText(`${wibStr} | Lat:${userLat.toFixed(4)} Lng:${userLng.toFixed(4)}`, 10, canvas.height - 10);

        const fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);

        kunciTombolKerja(true);

        const payload = {
            action: "absen",
            username: document.getElementById('user').value.trim(),
            password: userPassKey,
            tipe: tipe,
            lat: userLat,
            lng: userLng,
            foto: fotoBase64
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "sukses") {
                alert("Absen " + tipe + " Berhasil!");
                cekStatusHariIni();
                muatStatistikTerbaruServer();
            } else {
                alert("Gagal Absen: " + data.pesan);
                cekAturanTombolKerja();
            }
        })
        .catch(err => {
            alert("Kesalahan jaringan/server saat mengirim absen!");
            cekAturanTombolKerja();
        });
    }

    // --- MUAT STATISTIK MURNI DARI SERVER ---
    function muatStatistikTerbaruServer() {
        const u = document.getElementById('user').value.trim();
        fetch(`${SCRIPT_URL}?action=getStatistik&username=${encodeURIComponent(u)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "sukses") {
                    document.getElementById('st-hadir').innerText = data.hadir || 0;
                    document.getElementById('st-telat').innerText = data.terlambat || 0;
                    document.getElementById('st-off').innerText = data.off || 0;
                    document.getElementById('st-ps').innerText = data.ps || 0;
                    if(data.labelPeriode) {
                        document.getElementById('label-periode').innerText = "Periode: " + data.labelPeriode;
                    }
                }
            });
    }

    // --- ADMIN PANEL FUNCTIONS ---
    function muatDataAdmin() {
        fetch(`${SCRIPT_URL}?action=getAdminLogs`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tabel-admin-body');
                tbody.innerHTML = "";

                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Belum ada data.</td></tr>';
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.waktu}</td>
                        <td>${row.nama}</td>
                        <td><span class="badge bg-secondary">${row.tipe}</span></td>
                        <td><span class="badge bg-info text-dark">${row.status}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }

    function unduhLaporanCSV() {
        const tglMulai = document.getElementById('tgl-mulai').value;
        const tglSelesai = document.getElementById('tgl-selesai').value;

        if(!tglMulai || !tglSelesai) {
            return alert("Pilih tanggal mulai dan tanggal selesai rekap terlebih dahulu!");
        }

        window.open(`${SCRIPT_URL}?action=exportCSV&start=${tglMulai}&end=${tglSelesai}`, '_blank');
    }

    // AUTO LOGIN SAAT HALAMAN DI-REFRESH
    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('sesi_username');
        const savedPass = localStorage.getItem('sesi_password');

        if (savedUser && savedPass) {
            document.getElementById('user').value = savedUser;
            document.getElementById('pass').value = savedPass;
            prosesLogin();
        }
    });
</script>
</body>
</html>
